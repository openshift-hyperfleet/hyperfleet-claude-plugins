name: "Plugin tests"

on:
  pull_request:
    paths:
      - "hyperfleet-jira/**"
      - "hyperfleet-work-triage/**"
      - "Makefile"
      - ".github/workflows/plugin-tests.yml"
  push:
    branches:
      - main
    paths:
      - "hyperfleet-jira/**"
      - "hyperfleet-work-triage/**"
      - "Makefile"
      - ".github/workflows/plugin-tests.yml"

permissions:
  contents: read

concurrency:
  group: plugin-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Run tests
        run: make test
